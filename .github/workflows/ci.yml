name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src scripts tests

      - name: Ruff format check
        run: ruff format --check src scripts tests

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t finrl-portfolio:ci .

      - name: Run container and smoke-test endpoints
        run: |
          docker run -d --rm --name finrl-ci -p 8000:8000 finrl-portfolio:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/healthz
          curl -sf http://localhost:8000/readyz
          curl -sf -X POST http://localhost:8000/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"volatility":0.15,"momentum":0.02,"drawdown":0.05,"cash_ratio":0.3}'
          docker stop finrl-ci
