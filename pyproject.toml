[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl-portfolio"
version = "0.1.0"
description = "RL-driven portfolio allocation: PPO/DQN agents trained on a simulated multi-regime market, with backtesting, evaluation, and a FastAPI serving layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # gymnasium/stable-baselines3/torch are pinned exactly, not floor-bound:
    # models/*.zip and *_vecnormalize.pkl are binary artifacts produced by
    # these exact versions, and stable-baselines3 does not guarantee
    # load-time compatibility across its own minor versions. An unpinned
    # `>=` here would let CI or a fresh install silently resolve a newer
    # trio than what the committed model was trained/serialized with.
    "gymnasium==1.0.0",
    "stable-baselines3==2.4.1",
    "torch==2.2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["finrl"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
